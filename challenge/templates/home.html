<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Space Weather Forum 🌠</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #0b0c1e, #1c1f33);
            color: #eee;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left-panel,
        .right-panel {
            padding: 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            background: rgba(20, 20, 30, 0.9);
            border-right: 1px solid #444;
            justify-content: space-between;
        }

        .right-panel {
            background: rgba(10, 10, 20, 0.9);
            overflow-y: auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-grow: 1;
        }

        input,
        textarea {
            background: #1a1d2e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1rem;
        }

        button {
            background: #4c8eff;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #3a72d8;
        }

        #space-weather {
            font-size: 1.2rem;
            padding: 1.5rem;
            border-radius: 1rem;
            background: #22283c;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            min-height: 200px;
        }

        #messages {
            margin-top: 2rem;
            max-height: 30%;
            overflow-y: auto;
        }

        .success-message {
            background-color: #00cc88;
            color: #fff;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            animation: slideFade 0.6s ease-out forwards;
            box-shadow: 0 4px 10px rgba(0, 255, 170, 0.2);
        }

        @keyframes slideFade {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <!-- Forum Form -->
    <div class="left-panel">
        <div>
            <h1>🚀🌌🛰️✨👨‍🚀🌈🌠 Submit Your Forum</h1>
            <form hx-post="submit/" hx-target="#messages" hx-swap="beforeend">
                <input type="email" name="email" placeholder="example@email.com" required>
                <input type="text" name="fullname" placeholder="John Doe" required>
                <textarea name="message" rows="5" placeholder="Ask about the solar storm..." required></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>

        <!-- Where Success and Messages Appear -->
        <div id="messages"></div>
    </div>

    <!-- Live Space Weather View -->
    <div class="right-panel">
        <h1>🚀🌌🛰️✨👨‍🚀🌈🌠 Let's detect your text tone with Emoji</h1>
        <div id="emojify">
            <p>Detecting the emoji..</p>
        </div>
    </div>

    <!-- Live Data Script -->
    <script>
        const source = new EventSource("/events/");
        source.onmessage = function (event) {
            const data = JSON.parse(event.data);
            console.log("Received data:", data);
            document.getElementById("emojify").innerHTML = data.data.subject;
        };
    </script>

</body>

</html>
