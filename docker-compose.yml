version: '3.8'

services:
  web:
    build: .
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - redis
  django-q2:
    build: .
    restart: always
    command: python manage.py qcluster
    depends_on:
      - redis
      - web
    volumes:
      - ./:/usr/src/app/
    env_file:
      - .env
  redis:
    image: redis:latest
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
